<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Car Racing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="scoreboard" aria-label="Game information">
      <div>
        <span class="label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div>
        <span class="label">Speed</span>
        <strong id="speed">1</strong>
      </div>
      <button id="start-button" type="button">Start Race</button>
    </section>

    <section class="track-wrap" aria-label="Car racing game">
      <canvas id="game" width="420" height="640" aria-label="Top-down car racing game"></canvas>
      <div id="message" class="message">
        <h1>Mini Car Racing</h1>
        <p>Dodge traffic, collect points, and stay on the road.</p>
        <p class="controls">Move with ← → or A D. Press Space to start.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
